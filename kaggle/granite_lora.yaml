# LoRA fine-tune of IBM Granite-4.0-H-Tiny (Ghassan v1 Flash recipe)
# Geometry (hidden/layers/heads/experts/mamba dims) comes from the checkpoint
# itself via --model <granite-dir>; this file owns ONLY the adapter + the
# training schedule.
model:
  lora_rank: 16
  lora_alpha: 32.0
  lora_target_q: true
  lora_target_k: true
  lora_target_v: true
  lora_target_o: true
  # The MoE experts and the shared expert are deliberately NOT adapted: the
  # engine trains LoRA on attention projections only for hybrid MoE models.
  lora_target_gate: false
  lora_target_up: false
  lora_target_down: false

training:
  stage: sft
  data_dir: /kaggle/working/shards
  train_prefix: train
  val_prefix: val
  batch_size: 1
  seq_len: 512
  grad_accum: 8               # effective batch = 8 sequences
  epochs: 2
  learning_rate: 1.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 20
  optimizer: adamw
  scheduler: cosine
  weight_decay: 0.01
  grad_clip: 1.0
  precision: fp32             # activations + adapters; base weights are fp16 (--weight-f16 1)
  gemm_fp16: true
  log_every: 10
  eval_every: 50
  eval_batches: 20
  save_every: 200
  checkpoint_dir: /kaggle/working/ckpt
  resume: auto
