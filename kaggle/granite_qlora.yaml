# QLoRA fine-tune of IBM Granite-4.0-H-Tiny (Ghassan v1 Flash recipe)
# Needs the base as GGUF Q4_0/Q4_1/Q8_0 (see kaggle/README.md section 3b):
#   ghassan-ai quantize --model <granite-dir> --out granite_q4_0.gguf --profile q4_0
#, then pass --weight-q4 0 to gai_train. Loss scaling: the adapters train in
# fp32, so the usual fp16 ramp applies.
model:
  lora_rank: 16
  lora_alpha: 32.0
  lora_target_q: true
  lora_target_k: true
  lora_target_v: true
  lora_target_o: true
  lora_target_gate: false
  lora_target_up: false
  lora_target_down: false

training:
  stage: sft
  data_dir: /kaggle/working/shards
  train_prefix: train
  val_prefix: val
  batch_size: 1
  seq_len: 512
  grad_accum: 8
  epochs: 2
  learning_rate: 1.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 20
  optimizer: adamw
  scheduler: cosine
  weight_decay: 0.01
  grad_clip: 1.0
  precision: fp32             # adapter masters + activations; base is packed Q4 on device
  gemm_fp16: true
  log_every: 10
  eval_every: 50
  eval_batches: 20
  save_every: 200
  checkpoint_dir: /kaggle/working/ckpt_qlora
  resume: auto
