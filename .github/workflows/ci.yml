name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    name: linux / cpu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGAI_ENABLE_CUDA=OFF
          -DGAI_ENABLE_OPENMP=ON

      - name: Build
        run: cmake --build build --parallel

      - name: The CLI answers
        run: ./build/bin/ghassan-ai --help

      - name: The Granite fixture loads and generates
        run: |
          ./build/bin/ghassan-ai info --model granite_tiny
          ./build/bin/ghassan-ai generate --model granite_tiny --prompt "salam" \
              --max-tokens 8 --greedy --no-stream --raw

      - name: The GGUF round trip
        run: |
          ./build/bin/ghassan-ai quantize --model granite_tiny --out build/granite_tiny.gguf \
              --profile q8_k --model-name "Ghassan v1 Flash"
          ./build/bin/ghassan-ai info --model build/granite_tiny.gguf

  linux-sanitize:
    name: linux / asan+ubsan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAI_ENABLE_CUDA=OFF
          -DGAI_ENABLE_OPENMP=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: The Granite fixture under the sanitizers
        run: |
          ./build-asan/bin/ghassan-ai generate --model granite_tiny --prompt "salam" \
              --max-tokens 8 --greedy --no-stream --raw

  windows-msvc:
    name: windows / msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -A x64 -DGAI_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The CLI answers
        run: ./build/bin/Release/ghassan-ai.exe --help
