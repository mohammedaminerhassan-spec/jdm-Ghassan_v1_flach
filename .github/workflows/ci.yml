name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-cpu:
    name: linux / cpu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake --version
          ninja --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGAI_ENABLE_CUDA=OFF
          -DGAI_ENABLE_OPENMP=ON

      - name: Build
        run: cmake --build build --parallel

      - name: The CLI answers
        run: ./build/bin/ghassan-ai --help

      - name: The Granite config is parsed
        run: |
          ./build/bin/ghassan-ai info --model "granite-documentation/granit filles confiques" --config-only

      - name: The unit tests
        run: ctest --test-dir build --output-on-failure

      - name: The Granite forward matches the independent reference
        run: |
          python3 -m pip install --quiet numpy
          python3 tests/python/test_granite_forward.py --exe build/bin/ghassan-ai

  linux-sanitize:
    name: linux / asan+ubsan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGAI_ENABLE_CUDA=OFF
          -DGAI_ENABLE_OPENMP=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: The Granite config is parsed under the sanitizers
        run: |
          ./build-asan/bin/ghassan-ai info --model "granite-documentation/granit filles confiques" --config-only

  windows-msvc:
    name: windows / msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -A x64 -DGAI_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The CLI answers
        run: ./build/bin/Release/ghassan-ai.exe --help
